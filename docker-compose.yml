services:
  db:
    image: postgres:16-alpine
    container_name: ml_automation_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ml_automation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ml_automation"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ml_automation_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ml_automation_backend
    restart: unless-stopped
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ml_automation
      AUTH_COOKIE_NAME: ml_auth_session
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: lax
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_SESSION_TTL_MINUTES: "480"
      AUTH_RATE_LIMIT_ATTEMPTS: "5"
      AUTH_RATE_LIMIT_WINDOW_MINUTES: "15"
      LLM_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-200}
      UPLOAD_CHUNK_SIZE_MB: ${UPLOAD_CHUNK_SIZE_MB:-1}
      UPLOAD_ALLOWED_EXTENSIONS: ${UPLOAD_ALLOWED_EXTENSIONS:-.csv,.xlsx,.xls,.json}
      MAX_XLSX_ZIP_ENTRIES: ${MAX_XLSX_ZIP_ENTRIES:-1000}
      MAX_XLSX_TOTAL_UNCOMPRESSED_MB: ${MAX_XLSX_TOTAL_UNCOMPRESSED_MB:-300}
      MAX_XLSX_ENTRY_UNCOMPRESSED_MB: ${MAX_XLSX_ENTRY_UNCOMPRESSED_MB:-100}
      MAX_XLSX_COMPRESSION_RATIO: ${MAX_XLSX_COMPRESSION_RATIO:-100}
      MAX_DATAFRAME_ROWS: ${MAX_DATAFRAME_ROWS:-1000000}
      MAX_DATAFRAME_COLUMNS: ${MAX_DATAFRAME_COLUMNS:-500}
      MAX_DATAFRAME_MEMORY_MB: ${MAX_DATAFRAME_MEMORY_MB:-512}
      MAX_TIMELINE_SNAPSHOTS: ${MAX_TIMELINE_SNAPSHOTS:-1}
      MAX_TIMELINE_SNAPSHOT_MEMORY_MB: ${MAX_TIMELINE_SNAPSHOT_MEMORY_MB:-256}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./requirements.txt:/app/requirements.txt:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - backend_temp:/app/backend/temp
      - backend_logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:8000/api/health').getcode() == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      target: deps
    container_name: ml_automation_frontend
    restart: unless-stopped
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api/backend
      NEXT_PUBLIC_AUTH_COOKIE_NAME: ml_auth_session
      REDIS_URL: redis://redis:6379/0
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-next:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  postgres_data:
  backend_temp:
  backend_logs:
  frontend_node_modules:
  frontend_next_cache:
  redis_data:
